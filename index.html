<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر برواز | إطارات حسب الطلب</title>
  
  <!-- خط تجوال العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --modal-bg: #111827;
      --primary-gold: #f59e0b;
      --primary-gold-hover: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(245, 158, 11, 0.25);
      --border-focus: rgba(245, 158, 11, 0.6);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      direction: rtl;
      text-align: right;
      padding-bottom: 50px;
    }

    /* رأس الصفحة (Header) */
    header {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--primary-gold);
      object-fit: cover;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    .brand-title p {
      font-size: 0.8rem;
      color: var(--primary-gold);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* قسم تصفية الفئات */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 40;
    }

    .custom-dropdown {
      position: relative;
      width: 240px;
    }

    /* زر الفئات المحسن */
    .dropdown-btn {
      width: 100%;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1.5px solid var(--primary-gold);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .dropdown-btn:hover {
      background: #1a243d;
      border-color: #fbbf24;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.2);
    }

    .dropdown-btn .selected-text {
      flex: 1;
      text-align: center;
    }

    .dropdown-btn .arrow-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--primary-gold);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s ease;
    }

    .custom-dropdown.active .arrow-icon {
      transform: rotate(180deg);
    }

    /* القائمة المنسدلة الزجاجية الفخمة */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      background: #151d30;
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-md);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      padding: 6px;
      list-style: none;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
      overflow: hidden;
      animation: fadeIn 0.2s ease forwards;
    }

    .custom-dropdown.active .dropdown-menu {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .dropdown-item:hover {
      background: rgba(245, 158, 11, 0.15);
      color: var(--primary-gold);
    }

    .dropdown-item.selected {
      background: var(--primary-gold);
      color: #000;
      font-weight: 700;
    }

    /* شبكة المنتجات */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border-color: var(--border-focus);
    }

    .card-media-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #0d121f;
      overflow: hidden;
    }

    .card-media-wrapper img, .card-media-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .card-media-wrapper img {
      transform: scale(1.04);
    }

    .media-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 8px;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--primary-gold);
      font-weight: 500;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    .card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-gold);
      margin-top: 4px;
    }

    /* نافذة تفاصيل المنتج (Modal Popup) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: var(--modal-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalScale {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* زر الإغلاق X المرتب والمتناسق مع الحواف */
    .modal-close-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      transform: scale(1.08);
    }

    .modal-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* شاشة عرض الوسائط بالنافذة */
    .modal-media-main {
      width: 100%;
      height: 320px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
    }

    .modal-media-main img, .modal-media-main video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* شريط الصور المصغرة لمعرض الوسائط */
    .modal-thumbnails {
      display: flex;
      gap: 10px;
      padding: 12px 18px;
      background: #0d1322;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .thumb-item {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      position: relative;
      background: #111;
      transition: border-color 0.2s ease;
    }

    .thumb-item.active {
      border-color: var(--primary-gold);
    }

    .thumb-item img, .thumb-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-video-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* تفاصيل المحتوى في النافذة */
    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: right;
    }

    .modal-category {
      font-size: 0.85rem;
      color: var(--primary-gold);
      font-weight: 600;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }

    .modal-price {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary-gold);
    }

    .modal-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-line;
    }

    /* زر الطلب عبر واتساب */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 13px;
      border-radius: var(--radius-md);
      transition: all 0.25s ease;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
    }

    .whatsapp-btn:hover {
      background: #20ba5a;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
    }

    .whatsapp-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- رأس الصفحة -->
  <header>
    <div class="brand">
      <img src="photos/icon.webp" alt="شعار المتجر" onerror="this.style.display='none'">
      <div class="brand-title">
        <h1>متجر برواز</h1>
        <p>إطارات حسب الطلب</p>
      </div>
    </div>
  </header>

  <!-- الحاوية الرئيسية -->
  <div class="container">
    
    <!-- زر تصفية الفئات المنسدل -->
    <div class="filter-wrapper">
      <div class="custom-dropdown" id="categoryDropdown">
        <button class="dropdown-btn" id="dropdownBtn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="selected-text" id="selectedCategoryText">جميع المنتجات</span>
          <svg class="arrow-icon" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <ul class="dropdown-menu" id="categoryMenu" role="menu">
          <!-- تُضاف الفئات ديناميكياً هنا -->
        </ul>
      </div>
    </div>

    <!-- شبكة عرض المنتجات -->
    <div class="products-grid" id="productsGrid"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <h3>لا توجد منتجات متاحة في هذه الفئة حالياً.</h3>
    </div>
  </div>

  <!-- نافذة تفاصيل المنتج (Modal Popup) -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-container">
      <!-- زر الإغلاق X -->
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="إغلاق">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- عرض الصورة أو الفيديو الرئيسي -->
      <div class="modal-media-main" id="modalMediaMain"></div>

      <!-- شريط الصور المصغرة -->
      <div class="modal-thumbnails" id="modalThumbnails" style="display: none;"></div>

      <!-- بيانات المنتج -->
      <div class="modal-body">
        <span class="modal-category" id="modalCategory"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <p class="modal-desc" id="modalDesc"></p>

        <!-- زر الطلب عبر الواتساب -->
        <a href="#" class="whatsapp-btn" id="modalWhatsAppBtn" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm5.79 14.07c-.24.68-1.4 1.26-1.92 1.34-.51.08-1.18.11-3.39-.81-2.22-.92-3.64-3.18-3.75-3.33-.11-.15-.9-1.2-1.02-1.36-.12-.16-.25-.37-.25-.63 0-.26.13-.5.18-.57.06-.08.15-.17.23-.26.08-.09.11-.15.17-.26.06-.11.03-.2-.01-.29-.05-.08-.43-1.04-.59-1.42-.16-.38-.32-.33-.44-.33-.11 0-.25-.01-.39-.01s-.36.05-.55.26c-.19.2-1.05 1.03-1.05 2.51 0 1.48 1.08 2.91 1.23 3.11.15.2 2.13 3.25 5.16 4.56.72.31 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.78-.73 2.03-1.43.25-.7.25-1.31.18-1.43-.07-.12-.26-.2-.55-.35z"/>
          </svg>
          <span>اطلب الآن عبر واتساب</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // ضع رقم واتساب المتجر هنا مع المفتاح الدولي بدون إشارة + أو 00 (مثال: 967XXXXXXXXX)
    const WHATSAPP_PHONE = '967782605206';

    let allProducts = [];
    let currentCategory = 'all';

    // عناصر الصفحة
    const productsGrid = document.getElementById('productsGrid');
    const emptyState = document.getElementById('emptyState');
    const categoryDropdown = document.getElementById('categoryDropdown');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const selectedCategoryText = document.getElementById('selectedCategoryText');
    const categoryMenu = document.getElementById('categoryMenu');

    const productModal = document.getElementById('productModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalMediaMain = document.getElementById('modalMediaMain');
    const modalThumbnails = document.getElementById('modalThumbnails');
    const modalCategory = document.getElementById('modalCategory');
    const modalTitle = document.getElementById('modalTitle');
    const modalPrice = document.getElementById('modalPrice');
    const modalDesc = document.getElementById('modalDesc');
    const modalWhatsAppBtn = document.getElementById('modalWhatsAppBtn');

    // 1. جلب المنتجات من products.json
    async function loadProducts() {
      try {
        const res = await fetch('products.json?t=' + Date.now());
        if (!res.ok) throw new Error('فشل جلب المنتجات');
        allProducts = await res.json();
        setupCategories(allProducts);
        renderProducts(allProducts);
      } catch (err) {
        console.error(err);
        productsGrid.innerHTML = '<div class="empty-state"><h3>فشل تحميل المنتجات، يرجى المحاولة لاحقاً.</h3></div>';
      }
    }

    // 2. إعداد قائمة الفئات تلقائياً
    function setupCategories(products) {
      const categories = new Set();
      products.forEach(p => {
        if (p.category && p.category.trim() !== '') {
          categories.add(p.category.trim());
        }
      });

      categoryMenu.innerHTML = '';

      // خيار جميع المنتجات
      const allItem = document.createElement('li');
      allItem.className = 'dropdown-item selected';
      allItem.textContent = 'جميع المنتجات';
      allItem.dataset.category = 'all';
      allItem.onclick = () => selectCategory('all', 'جميع المنتجات', allItem);
      categoryMenu.appendChild(allItem);

      // إضافة باقي الفئات
      categories.forEach(cat => {
        const item = document.createElement('li');
        item.className = 'dropdown-item';
        item.textContent = cat;
        item.dataset.category = cat;
        item.onclick = () => selectCategory(cat, cat, item);
        categoryMenu.appendChild(item);
      });
    }

    // فتح وإغلاق قائمة الفئات
    dropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      categoryDropdown.classList.toggle('active');
    });

    // إغلاق القائمة عند النقر في أي مكان خارجها
    document.addEventListener('click', (e) => {
      if (!categoryDropdown.contains(e.target)) {
        categoryDropdown.classList.remove('active');
      }
    });

    // اختيار الفئة وتصفية المنتجات
    function selectCategory(catKey, catName, element) {
      currentCategory = catKey;
      selectedCategoryText.textContent = catName;
      categoryDropdown.classList.remove('active');

      document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      const filtered = catKey === 'all' 
        ? allProducts 
        : allProducts.filter(p => p.category && p.category.trim() === catKey);

      renderProducts(filtered);
    }

    // 3. عرض بطاقات المنتجات
    function renderProducts(products) {
      productsGrid.innerHTML = '';
      if (!products || products.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      products.forEach(product => {
        const mediaList = product.media && product.media.length > 0 
          ? product.media 
          : [{ type: 'image', url: product.image }];

        const firstMedia = mediaList[0];
        const hasMultiple = mediaList.length > 1;
        const hasVideo = mediaList.some(m => m.type === 'video');

        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openModal(product);

        let mediaHtml = '';
        if (firstMedia.type === 'video') {
          mediaHtml = `<video src="${firstMedia.url}" muted playsinline loop onmouseover="this.play()" onmouseout="this.pause()"></video>`;
        } else {
          mediaHtml = `<img src="${firstMedia.url || product.image}" alt="${product.name}" loading="lazy" onerror="this.src='photos/icon.webp'">`;
        }

        let badgeHtml = '';
        if (hasVideo) {
          badgeHtml = `<span class="media-badge">▶ فيديو</span>`;
        } else if (hasMultiple) {
          badgeHtml = `<span class="media-badge">📷 ${mediaList.length}</span>`;
        }

        card.innerHTML = `
          <div class="card-media-wrapper">
            ${mediaHtml}
            ${badgeHtml}
          </div>
          <div class="card-info">
            <div>
              <div class="card-category">${product.category || 'عام'}</div>
              <h3 class="card-title">${product.name}</h3>
            </div>
            <div class="card-price">${product.price} ريال</div>
          </div>
        `;
        productsGrid.appendChild(card);
      });
    }

    // 4. نافذة تفاصيل المنتج ومعرض الوسائط
    function openModal(product) {
      const mediaList = product.media && product.media.length > 0 
        ? product.media 
        : [{ type: 'image', url: product.image }];

      modalCategory.textContent = product.category || 'عام';
      modalTitle.textContent = product.name;
      modalPrice.textContent = `${product.price} ريال`;
      modalDesc.textContent = product.description || '';

      // تجهيز رابط الواتساب مع رسالة الطلب
      const message = `مرحباً، أود طلب المنتج التالي من متجر برواز:\n*${product.name}*\nالسعر: ${product.price} ريال\nرابط المنتج: ${window.location.origin}${window.location.pathname}?id=${product.id}`;
      modalWhatsAppBtn.href = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;

      // تجهيز معرض الصور والفيديو
      setupModalMedia(mediaList);

      productModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function setupModalMedia(mediaList) {
      modalThumbnails.innerHTML = '';
      
      function setMainMedia(item) {
        if (item.type === 'video') {
          modalMediaMain.innerHTML = `<video src="${item.url}" controls autoplay playsinline style="max-height:100%; max-width:100%;"></video>`;
        } else {
          modalMediaMain.innerHTML = `<img src="${item.url}" alt="صورة المنتج" style="max-height:100%; max-width:100%; object-fit:contain;">`;
        }
      }

      setMainMedia(mediaList[0]);

      if (mediaList.length > 1) {
        modalThumbnails.style.display = 'flex';
        mediaList.forEach((item, index) => {
          const thumb = document.createElement('div');
          thumb.className = `thumb-item ${index === 0 ? 'active' : ''}`;
          
          if (item.type === 'video') {
            thumb.innerHTML = `<video src="${item.url}" muted></video><span class="thumb-video-badge">▶</span>`;
          } else {
            thumb.innerHTML = `<img src="${item.url}" alt="مصغرة">`;
          }

          thumb.onclick = () => {
            document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
            setMainMedia(item);
          };

          modalThumbnails.appendChild(thumb);
        });
      } else {
        modalThumbnails.style.display = 'none';
      }
    }

    function closeModal() {
      productModal.classList.remove('active');
      modalMediaMain.innerHTML = ''; // إيقاف تشغيل الفيديو
      document.body.style.overflow = '';
    }

    modalCloseBtn.onclick = closeModal;
    productModal.onclick = (e) => {
      if (e.target === productModal) closeModal();
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && productModal.classList.contains('active')) {
        closeModal();
      }
    });

    // فتح المنتج مباشرة إذا كان الرابط يحتوي على ID في المعاملات
    window.addEventListener('DOMContentLoaded', async () => {
      await loadProducts();
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      if (productId && allProducts.length > 0) {
        const found = allProducts.find(p => p.id === productId);
        if (found) openModal(found);
      }
    });
  </script>
</body>
</html>
