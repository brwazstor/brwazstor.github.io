<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRWAZ Store | متجر برواز</title>
    <!-- أيقونة المتجر -->
    <link rel="icon" href="https://raw.githubusercontent.com/brwazstor/brwazstor.github.io/main/photos/icon.webp" type="image/webp">
    <!-- مكتبة الأيقونات (FontAwesome) للتواصل -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* */
        :root {
            --primary: #cda434; /* لون ذهبي راقي */
            --primary-glow: rgba(205, 164, 52, 0.4);
            
            /* ألوان مدمجة للوضع الليلي */
            --bg-dark-gradient: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #111827);
            --text-dark: #f8fafc;
            --card-dark: rgba(15, 23, 42, 0.6);
            --border-dark: rgba(255, 255, 255, 0.1);
            
            /* ألوان مدمجة مريحة للعين للوضع الصباحي (كريمي وذهبي فاتح) */
            --bg-light-gradient: linear-gradient(-45deg, #fdf6e3, #f5e8c7, #fff9e6, #f0e4d4);
            --text-light: #1e293b;
            --card-light: rgba(255, 255, 255, 0.6);
            --border-light: rgba(205, 164, 52, 0.2);
            
            --glass-blur: blur(16px);
        }

        /* */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            background: var(--bg-dark-gradient);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body.light-mode {
            background: var(--bg-light-gradient);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: var(--text-light);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* توقيف الحركات في وضع الـ Lite */
        body.lite-mode {
            background-size: 100% 100%;
        }
        body.lite-mode, body.lite-mode * {
            animation: none !important;
            backdrop-filter: none !important;
        }

        /* */
        .bg-frames {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .bg-frames li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px; height: 20px;
            border: 2px solid var(--primary-glow);
            background: transparent;
            animation: floatUp 25s linear infinite;
            bottom: -150px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* أحجام ومواقع مختلفة للإطارات العائمة */
        .bg-frames li:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-frames li:nth-child(2) { left: 35%; width: 50px; height: 50px; animation-delay: 2s; animation-duration: 12s; border-radius: 10px; }
        .bg-frames li:nth-child(3) { left: 70%; width: 100px; height: 100px; animation-delay: 4s; }
        .bg-frames li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; border-radius: 5px; }
        .bg-frames li:nth-child(5) { left: 85%; width: 120px; height: 120px; animation-delay: 0s; }
        .bg-frames li:nth-child(6) { left: 25%; width: 40px; height: 40px; animation-delay: 5s; border-radius: 5px;}

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-dark);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-dark);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light-mode header {
            background: var(--card-light);
            border-bottom: 1px solid var(--border-light);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-glow);
            object-fit: cover;
        }

        .logo-container h1 {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        body.light-mode .logo-container h1 { text-shadow: none; }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--primary);
            color: inherit;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* */
        .hero {
            text-align: center;
            padding: 60px 20px 30px;
            position: relative;
            z-index: 10;
        }

        .hero h2 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: var(--primary);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        body.light-mode .hero h2 { text-shadow: 0 2px 5px rgba(205,164,52,0.3); }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.8;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        body.light-mode .hero p { text-shadow: none; font-weight: 500; }

        /* الأيقونات الدائرية العصرية */
        .contact-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .contact-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            color: var(--primary);
            font-size: 1.5rem;
            text-decoration: none;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, background 0.3s;
        }

        body.light-mode .contact-icon {
            background: #fff;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 10px rgba(205,164,52,0.15);
        }

        .contact-icon:hover {
            transform: translateY(-5px) scale(1.1);
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        /* ألوان مخصصة عند التمرير لكل منصة */
        .contact-icon.wa:hover { box-shadow: 0 0 15px #25D366; background: #25D366; border-color: #25D366;}
        .contact-icon.ig:hover { box-shadow: 0 0 15px #E1306C; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-color: transparent;}
        .contact-icon.em:hover { box-shadow: 0 0 15px #EA4335; background: #EA4335; border-color: #EA4335;}

        /* */
        .category-wrapper {
            display: flex;
            justify-content: center;
            padding: 0 20px 40px;
            position: relative;
            z-index: 10;
        }

        .category-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            color: var(--text-dark);
            padding: 12px 40px 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            min-width: 200px;
            text-align: right;
            outline: none;
        }

        body.light-mode .category-select {
            background: #fff;
            color: var(--text-light);
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 10px rgba(205,164,52,0.1);
        }

        .category-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .category-select option {
            background: #1e293b;
            color: #fff;
            padding: 10px;
        }
        body.light-mode .category-select option {
            background: #fff;
            color: #000;
        }

        /* سهم القائمة المنسدلة المخصص */
        .select-icon {
            position: absolute;
            left: calc(50% - 85px); /* ضبط موقع السهم */
            top: 50%;
            transform: translateY(-80%);
            color: var(--primary);
            pointer-events: none;
            font-size: 0.9rem;
        }

        /* */
        .grid-container {
            column-count: 3;
            column-gap: 20px;
            padding: 0 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 900px) { .grid-container { column-count: 2; } }
        @media (max-width: 600px) { .grid-container { column-count: 1; } }

        .product-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 15px;
            margin-bottom: 20px;
            break-inside: avoid;
            overflow: hidden;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transform: translateY(0);
        }

        body.light-mode .product-card {
            background: var(--card-light);
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 15px rgba(205,164,52,0.1);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--primary-glow);
            border-color: var(--primary);
        }

        .product-card img {
            width: 100%;
            display: block;
            object-fit: cover;
            border-bottom: 1px solid var(--border-dark);
            min-height: 200px;
            background: rgba(0,0,0,0.2);
        }
        
        body.light-mode .product-card img { border-bottom: 1px solid var(--border-light); background: #fdf6e3;}

        .product-info {
            padding: 15px;
        }

        .product-info h3 { font-size: 1.2rem; margin-bottom: 5px; font-weight: bold;}
        .product-info .price { color: var(--primary); font-weight: bold; font-size: 1.1rem; }
        .product-info .cat-label {
            display: inline-block;
            font-size: 0.75rem;
            background: var(--primary-glow);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 12px;
            margin-top: 8px;
            font-weight: bold;
        }
        body.light-mode .product-info .cat-label { background: rgba(205, 164, 52, 0.15); }

        /* */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 25px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- نظام السلايدر (Carousel) الفخم --- */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 40vh;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3) inset;
        }
        .carousel-item {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeEffect 0.5s ease-in-out;
        }
        .carousel-item.active {
            display: block;
        }
        .carousel-item img, .carousel-item video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: var(--primary);
            border: 1px solid var(--primary);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .carousel-btn:hover { background: var(--primary); color: #fff; }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: 0.3s;
        }
        .dot.active {
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }
        @keyframes fadeEffect {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
        /* ------------------------------------- */

        body.light-mode .modal-content {
            background: #fff;
            color: #000;
            border: 1px solid var(--primary);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 40vh;
            border-radius: 10px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: -15px; right: -15px; /* تم إخراج الزر خارج الإطار لكي لا يغطي الصورة */
            background: #ff4757; 
            border: 2px solid #fff;
            color: #fff; 
            width: 35px; height: 35px; 
            border-radius: 50%;
            font-size: 1.2rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s, background 0.3s;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .close-modal:hover { transform: scale(1.1) rotate(90deg); background: #ff6b81; }

        .order-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: #25D366;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .order-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }

        .perf-notice {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #ff4757; color: #fff; padding: 10px 20px;
            border-radius: 20px; display: none; z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 0.9rem; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الإطارات العائمة في الخلفية -->
    <ul class="bg-frames">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <header>
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/brwazstor/brwazstor.github.io/main/photos/icon.webp" alt="BRWAZ Icon">
            <h1>BRWAZ</h1>
        </div>
        <div class="controls">
            <button class="btn" id="themeToggle" onclick="toggleTheme()"><i class="fa-solid fa-sun"></i></button>
            <button class="btn" id="liteToggle" onclick="toggleLite()"><i class="fa-solid fa-bolt"></i> Lite</button>
        </div>
    </header>

    <section class="hero">
        <h2>إطارات تصنع الذكريات</h2>
        <p>اكتشف مجموعتنا الفاخرة من الإطارات المصممة خصيصاً لتناسب ذوقك الرفيع. دقة في التفاصيل وجودة تدوم طويلاً.</p>
        
        <!-- الأيقونات الدائرية الجديدة -->
        <div class="contact-links">
            <a href="https://www.instagram.com/brwaz.stor1/" target="_blank" class="contact-icon ig" title="إنستقرام"><i class="fa-brands fa-instagram"></i></a>
            <a href="mailto:brwaas.store@gmail.com" class="contact-icon em" title="إرسال إيميل"><i class="fa-solid fa-envelope"></i></a>
            <a href="https://wa.me/967782605206" target="_blank" class="contact-icon wa" title="واتساب"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </section>

    <!-- القائمة المنسدلة الذكية للفئات -->
    <div class="category-wrapper" id="categoryWrapper" style="display: none;">
        <select class="category-select" id="categorySelect" onchange="filterCategory(this.value)">
            <option value="الكل">جميع المنتجات</option>
            <!-- الخيارات ستضاف هنا برمجياً -->
        </select>
        <i class="fa-solid fa-chevron-down select-icon"></i>
    </div>

    <div class="grid-container" id="productGrid">
        <!-- المنتجات ستضاف هنا -->
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div id="carouselContainer" class="carousel-container">
                <!-- الصور والفيديو ستضاف هنا برمجياً -->
            </div>
            <h2 id="modalTitle"></h2>
            <h3 id="modalPrice" class="price" style="color:var(--primary); margin:10px 0;"></h3>
            <p id="modalDesc"></p>
            <a id="modalOrder" href="#" class="order-btn" target="_blank"><i class="fa-brands fa-whatsapp"></i> اطلب الآن عبر واتساب</a>
        </div>
    </div>

    <div class="perf-notice" id="perfNotice">
        جهازك يواجه ثقلاً، تم اقتراح تفعيل وضع Lite ⚡
    </div>

    <script>
        /* */
        const CACHE_KEY = 'brwaz_data_v3';

        const initSettings = () => {
            if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
            if(localStorage.getItem('lite') === 'true') document.body.classList.add('lite-mode');
            updateButtons();
        };

        const toggleTheme = () => {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            updateButtons();
        };

        const toggleLite = () => {
            document.body.classList.toggle('lite-mode');
            localStorage.setItem('lite', document.body.classList.contains('lite-mode') ? 'true' : 'false');
            updateButtons();
        };

        const updateButtons = () => {
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeToggle').innerHTML = isLight ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
            document.getElementById('liteToggle').style.background = document.body.classList.contains('lite-mode') ? 'var(--primary)' : 'rgba(255, 255, 255, 0.05)';
            document.getElementById('liteToggle').style.color = document.body.classList.contains('lite-mode') ? '#fff' : 'inherit';
        };

        initSettings();

        /* */
        let allProducts = [];

        const loadProducts = async () => {
            const cached = localStorage.getItem(CACHE_KEY);
            if(cached) {
                try {
                    allProducts = JSON.parse(cached);
                    if(allProducts.length > 0 && !allProducts[0].name) throw new Error("Bad cache");
                    renderCategories();
                    renderGrid('الكل');
                    checkUrlForProduct();
                } catch(e) { allProducts = []; }
            }

            try {
                const res = await fetch('products.json?v=' + new Date().getTime());
                const data = await res.json();
                
                if (data && Array.isArray(data)) {
                    const validData = data.filter(p => p && p.name && p.image);
                    if(JSON.stringify(validData) !== cached) {
                        allProducts = validData;
                        localStorage.setItem(CACHE_KEY, JSON.stringify(validData));
                        renderCategories();
                        renderGrid('الكل');
                    }
                }
            } catch (e) {
                console.log("خطأ في جلب البيانات:", e);
            }
        };

        const renderCategories = () => {
            const selectEl = document.getElementById('categorySelect');
            const wrapper = document.getElementById('categoryWrapper');
            
            if (allProducts.length === 0) {
                wrapper.style.display = 'none';
                return;
            }
            
            wrapper.style.display = 'flex';
            const categories = [...new Set(allProducts.map(p => p.category || 'عام'))];
            
            let optionsHTML = '<option value="الكل">جميع المنتجات</option>';
            categories.forEach(cat => {
                optionsHTML += `<option value="${cat}">${cat}</option>`;
            });
            
            // نحتفظ باختيار المستخدم إذا كان قد اختار فئة سابقة
            const currentValue = selectEl.value;
            selectEl.innerHTML = optionsHTML;
            if(categories.includes(currentValue)) selectEl.value = currentValue;
        };

        const filterCategory = (cat) => {
            renderGrid(cat);
        };

        const renderGrid = (filterCat) => {
            const grid = document.getElementById('productGrid');
            if (allProducts.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1;">لا توجد منتجات حالياً.</p>';
                return;
            }

            const filtered = filterCat === 'الكل' ? allProducts : allProducts.filter(p => (p.category || 'عام') === filterCat);
            
            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openModal('${p.id}')">
                    <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/brwazstor/brwazstor.github.io/main/photos/icon.webp';">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price}</div>
                        <span class="cat-label">${p.category || 'عام'}</span>
                    </div>
                </div>
            `).join('');
        };

        // نظام النافذة والروابط والسلايدر
        let currentMedia = [];
        let currentSlide = 0;

        const openModal = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;

            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalDesc').innerText = product.description || '';
            
            // تجهيز السلايدر
            currentMedia = product.media && product.media.length > 0 ? product.media : [{type: 'image', url: product.image}];
            currentSlide = 0;
            renderCarousel();
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + id;
            window.history.pushState({path:newUrl}, '', newUrl);

            const msg = encodeURIComponent(`مرحباً متجر برواز، أريد طلب:\n${product.name}\nالسعر: ${product.price}\nالرابط: ${newUrl}`);
            document.getElementById('modalOrder').href = `https://wa.me/967782605206?text=${msg}`;

            document.getElementById('productModal').classList.add('show');
        };

        const renderCarousel = () => {
            const container = document.getElementById('carouselContainer');
            if (currentMedia.length <= 1) {
                container.innerHTML = generateMediaHTML(currentMedia[0], true);
            } else {
                let html = currentMedia.map((m, i) => generateMediaHTML(m, i === currentSlide)).join('');
                html += `<button class="carousel-btn prev" onclick="changeSlide(-1)">❮</button>
                         <button class="carousel-btn next" onclick="changeSlide(1)">❯</button>
                         <div class="carousel-dots">
                            ${currentMedia.map((m, i) => `<span class="dot ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})"></span>`).join('')}
                         </div>`;
                container.innerHTML = html;
            }
        };

        const generateMediaHTML = (media, isActive) => {
            const activeClass = isActive ? 'active' : '';
            if (media.type === 'video') {
                return `<div class="carousel-item ${activeClass}"><video controls ${isActive ? 'autoplay' : ''} loop playsinline><source src="${media.url}" type="video/mp4"></video></div>`;
            }
            return `<div class="carousel-item ${activeClass}"><img src="${media.url}" alt="Product Media"></div>`;
        };

        const changeSlide = (step) => {
            const oldVideo = document.querySelector('.carousel-item.active video');
            if(oldVideo) oldVideo.pause();

            currentSlide += step;
            if (currentSlide >= currentMedia.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = currentMedia.length - 1;
            renderCarousel();
        };

        const goToSlide = (index) => {
            const oldVideo = document.querySelector('.carousel-item.active video');
            if(oldVideo) oldVideo.pause();
            
            currentSlide = index;
            renderCarousel();
        };

        const closeModal = () => {
            const video = document.querySelector('.carousel-item.active video');
            if(video) video.pause(); // إيقاف الفيديو عند الإغلاق
            
            document.getElementById('productModal').classList.remove('show');
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:cleanUrl}, '', cleanUrl);
        };

        const checkUrlForProduct = () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if(id) setTimeout(() => openModal(id), 500);
        };

        let lastTime = performance.now();
        let frames = 0;
        let lowFpsCount = 0;

        const checkPerformance = () => {
            if (document.body.classList.contains('lite-mode')) return;
            const now = performance.now();
            frames++;
            if (now >= lastTime + 1000) {
                if (frames < 25) lowFpsCount++;
                else lowFpsCount = 0;
                
                if (lowFpsCount > 3 && !localStorage.getItem('liteSuggested')) {
                    document.getElementById('perfNotice').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('perfNotice').style.display = 'none';
                        localStorage.setItem('liteSuggested', 'true');
                    }, 6000);
                }
                frames = 0;
                lastTime = now;
            }
            requestAnimationFrame(checkPerformance);
        };

        loadProducts();
        requestAnimationFrame(checkPerformance);

    </script>
</body>
</html>
