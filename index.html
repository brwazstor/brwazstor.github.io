<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRWAZ Store | متجر برواز</title>
    <link rel="icon" href="https://github.com/brwazstor/brwazstor.github.io/blob/main/photos/icon.webp?raw=true" type="image/webp">
    <style>
        /* المتغيرات والألوان المتدرجة (Gradients) */
        :root {
            --primary: #cda434; /* لون ذهبي راقي */
            --bg-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --bg-light: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --text-dark: #f8fafc;
            --text-light: #0f172a;
            --card-dark: rgba(30, 41, 59, 0.7);
            --card-light: rgba(255, 255, 255, 0.7);
            --border-dark: rgba(255, 255, 255, 0.1);
            --border-light: rgba(0, 0, 0, 0.1);
            --glass-blur: blur(12px);
        }

        /* الإعدادات الأساسية */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.light-mode {
            background: var(--bg-light);
            color: var(--text-light);
        }

        body.lite-mode * {
            transition: none !important;
            animation: none !important;
            backdrop-filter: none !important;
        }

        /* الهيدر وشريط التحكم */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-dark);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-dark);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light-mode header {
            background: var(--card-light);
            border-bottom: 1px solid var(--border-light);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
        }

        .logo-container h1 {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: inherit;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* القسم الترحيبي (Hero Section) */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle, rgba(205,164,52,0.1) 0%, transparent 70%);
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }

        .contact-links a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            border-bottom: 1px solid transparent;
        }
        .contact-links a:hover {
            border-bottom: 1px solid var(--primary);
        }

        /* فلاتر الفئات */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 20px 30px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            color: inherit;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
        }

        body.light-mode .cat-btn {
            background: var(--card-light);
            border: 1px solid var(--border-light);
        }

        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* شبكة المنتجات (Masonry Layout) */
        .grid-container {
            column-count: 3;
            column-gap: 20px;
            padding: 0 20px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 900px) { .grid-container { column-count: 2; } }
        @media (max-width: 600px) { .grid-container { column-count: 1; } }

        .product-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 15px;
            margin-bottom: 20px;
            break-inside: avoid;
            overflow: hidden;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transform: translateY(0);
        }

        body.light-mode .product-card {
            background: var(--card-light);
            border: 1px solid var(--border-light);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(205,164,52,0.2);
        }

        .product-card img {
            width: 100%;
            display: block;
            object-fit: cover;
            border-bottom: 1px solid var(--border-dark);
        }
        
        body.light-mode .product-card img { border-bottom: 1px solid var(--border-light); }

        .product-info {
            padding: 15px;
        }

        .product-info h3 { font-size: 1.2rem; margin-bottom: 5px; }
        .product-info .price { color: var(--primary); font-weight: bold; font-size: 1.1rem; }
        .product-info .cat-label {
            display: inline-block;
            font-size: 0.75rem;
            background: rgba(205,164,52,0.2);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* النافذة المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 25px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        body.light-mode .modal-content {
            background: #fff;
            color: #000;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: inherit; font-size: 1.5rem; cursor: pointer;
        }

        .order-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        /* إشعار الأداء */
        .perf-notice {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #ff4757; color: #fff; padding: 10px 20px;
            border-radius: 20px; display: none; z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://github.com/brwazstor/brwazstor.github.io/blob/main/photos/icon.webp?raw=true" alt="BRWAZ Icon">
            <h1>BRWAZ</h1>
        </div>
        <div class="controls">
            <button class="btn" id="themeToggle" onclick="toggleTheme()">☀️ صباحي</button>
            <button class="btn" id="liteToggle" onclick="toggleLite()">⚡ Lite</button>
        </div>
    </header>

    <section class="hero">
        <h2>إطارات تصنع الذكريات</h2>
        <p>اكتشف مجموعتنا الفاخرة من الإطارات المصممة خصيصاً لتناسب ذوقك الرفيع. دقة في التفاصيل وجودة تدوم طويلاً.</p>
        <div class="contact-links">
            <a href="https://www.instagram.com/brwaz.stor1/" target="_blank">Instagram</a> | 
            <a href="mailto:brwaas.store@gmail.com">Email</a> |
            <a href="https://wa.me/967782605206" target="_blank">WhatsApp</a>
        </div>
    </section>

    <div class="categories" id="categoryContainer">
        <!-- الأزرار ستضاف هنا برمجياً -->
    </div>

    <div class="grid-container" id="productGrid">
        <!-- المنتجات ستضاف هنا -->
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <img id="modalImg" src="" alt="Product">
            <h2 id="modalTitle"></h2>
            <h3 id="modalPrice" class="price" style="color:var(--primary); margin:10px 0;"></h3>
            <p id="modalDesc"></p>
            <a id="modalOrder" href="#" class="order-btn" target="_blank">طلب عبر الواتساب</a>
        </div>
    </div>

    <div class="perf-notice" id="perfNotice">
        جهازك يواجه ثقلاً، تم اقتراح تفعيل وضع Lite ⚡
    </div>

    <script>
        // إعدادات المتصفح المحفوظة (Theme & Lite mode)
        const initSettings = () => {
            if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
            if(localStorage.getItem('lite') === 'true') document.body.classList.add('lite-mode');
            updateButtons();
        };

        const toggleTheme = () => {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            updateButtons();
        };

        const toggleLite = () => {
            document.body.classList.toggle('lite-mode');
            localStorage.setItem('lite', document.body.classList.contains('lite-mode') ? 'true' : 'false');
            updateButtons();
        };

        const updateButtons = () => {
            document.getElementById('themeToggle').innerText = document.body.classList.contains('light-mode') ? '🌙 ليلي' : '☀️ صباحي';
            document.getElementById('liteToggle').style.background = document.body.classList.contains('lite-mode') ? 'var(--primary)' : 'transparent';
            document.getElementById('liteToggle').style.color = document.body.classList.contains('lite-mode') ? '#fff' : 'inherit';
        };

        initSettings();

        // نظام جلب وعرض المنتجات مع التخزين المؤقت (Cache) للسرعة
        let allProducts = [];

        const loadProducts = async () => {
            // 1. عرض البيانات المخزنة فوراً إن وجدت (يمنع التعليق)
            const cached = localStorage.getItem('brwaz_data');
            if(cached) {
                allProducts = JSON.parse(cached);
                renderCategories();
                renderGrid('الكل');
                checkUrlForProduct();
            }

            // 2. جلب البيانات الجديدة في الخلفية بصمت
            try {
                // وضعنا الدالة لإجبار المتصفح على عدم قراءة كاش قديم جداً من السيرفر
                const res = await fetch('products.json?v=' + new Date().getTime());
                const data = await res.json();
                
                // تحديث العرض فقط إذا كان هناك تغيير لعدم إزعاج المستخدم
                if(JSON.stringify(data) !== cached) {
                    allProducts = data;
                    localStorage.setItem('brwaz_data', JSON.stringify(data));
                    renderCategories();
                    renderGrid('الكل');
                }
            } catch (e) {
                console.log("استخدام البيانات المخزنة محلياً بسبب ضعف الاتصال.");
            }
        };

        const renderCategories = () => {
            const container = document.getElementById('categoryContainer');
            // استخراج الفئات الفريدة
            const categories = ['الكل', ...new Set(allProducts.map(p => p.category || 'عام'))];
            
            container.innerHTML = categories.map(cat => 
                `<button class="cat-btn ${cat === 'الكل' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>`
            ).join('');
        };

        const filterCategory = (cat, btnEl) => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderGrid(cat);
        };

        const renderGrid = (filterCat) => {
            const grid = document.getElementById('productGrid');
            const filtered = filterCat === 'الكل' ? allProducts : allProducts.filter(p => (p.category || 'عام') === filterCat);
            
            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openModal('${p.id}')">
                    <!-- استخدام loading="lazy" للتحميل الذكي للصور -->
                    <img src="${p.image}" alt="${p.name}" loading="lazy">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price}</div>
                        <span class="cat-label">${p.category || 'عام'}</span>
                    </div>
                </div>
            `).join('');
        };

        // نظام النافذة والروابط
        const openModal = (id) => {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;

            document.getElementById('modalImg').src = product.image;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalDesc').innerText = product.description || '';
            
            // تحديث الرابط بدون إعادة تحميل الصفحة
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + id;
            window.history.pushState({path:newUrl}, '', newUrl);

            // تجهيز رسالة الواتساب
            const msg = encodeURIComponent(`مرحباً متجر برواز، أريد طلب:\n${product.name}\nالسعر: ${product.price}\nالرابط: ${newUrl}`);
            document.getElementById('modalOrder').href = `https://wa.me/967782605206?text=${msg}`;

            document.getElementById('productModal').classList.add('show');
        };

        const closeModal = () => {
            document.getElementById('productModal').classList.remove('show');
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:cleanUrl}, '', cleanUrl);
        };

        const checkUrlForProduct = () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if(id) setTimeout(() => openModal(id), 500);
        };

        // نظام مراقبة الأداء (FPS Monitor)
        let lastTime = performance.now();
        let frames = 0;
        let lowFpsCount = 0;

        const checkPerformance = () => {
            if (document.body.classList.contains('lite-mode')) return;
            const now = performance.now();
            frames++;
            if (now >= lastTime + 1000) {
                if (frames < 30) lowFpsCount++;
                else lowFpsCount = 0;
                
                if (lowFpsCount > 3 && !localStorage.getItem('liteSuggested')) {
                    document.getElementById('perfNotice').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('perfNotice').style.display = 'none';
                        localStorage.setItem('liteSuggested', 'true');
                    }, 5000);
                }
                frames = 0;
                lastTime = now;
            }
            requestAnimationFrame(checkPerformance);
        };

        // التشغيل
        loadProducts();
        requestAnimationFrame(checkPerformance);

    </script>
</body>
</html>
